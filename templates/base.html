{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ThreatLens — Cyber Threat Intelligence Dashboard{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand d-inline-flex align-items-center text-white" href="{% url 'threats:dashboard' %}">
      <img src="{% static 'img/threatlens-mark.svg' %}" alt="ThreatLens" height="34"> ThreatLens
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="{% url 'threats:dashboard' %}">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'threats:vulnerability_list' %}">Vulnerabilities</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Analytics</a></li>
        <li class="nav-item"><a class="nav-link" href="#">About</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container py-4">
    {% block content %}{% endblock %}
</main>

<footer class="container text-muted small py-4 border-top">
    Cyber Threat Intelligence Dashboard &middot; v0.1
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  document.querySelectorAll("time.js-local-datetime").forEach((el) => {
    const dt = new Date(el.getAttribute("datetime"));
    if (isNaN(dt)) return;
    const opts = el.dataset.mode === "time"
      ? { hour: "numeric", minute: "2-digit", timeZoneName: "short" }
      : { year: "numeric", month: "short", day: "numeric" };
    el.textContent = dt.toLocaleString(undefined, opts);
    el.title = dt.toLocaleString(undefined, { dateStyle: "full", timeStyle: "long" });
  });
</script>

</body>
</html>
